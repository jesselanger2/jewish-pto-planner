name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR / branch to save minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type-check · Lint · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (strict, no emit)
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        # Validates that the bundle compiles cleanly.
        # VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY are intentionally absent —
        # the app must build and work in local-only mode without them.
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
